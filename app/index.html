<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A contributor-friendly overview of current project activity.">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="page-header__content">
      <p class="eyebrow">Team workspace</p>
      <h1>Project Pulse</h1>
      <p>See what is moving, who owns it, and where contributors can help next.</p>
    </div>
  </header>

  <main class="dashboard" id="main-content">
    <section aria-labelledby="projects-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Current portfolio</p>
          <h2 id="projects-heading">Projects</h2>
        </div>
        <p id="project-count" aria-live="polite"></p>
      </div>

      <p id="loading-state" role="status">Loading projects...</p>
      <p id="error-state" role="alert" hidden>Projects could not be loaded. Please try again.</p>
      <ul class="project-grid" id="project-list" aria-live="polite" aria-busy="true"></ul>
    </section>
  </main>

  <script>
    const projectList = document.querySelector('#project-list');
    const loadingState = document.querySelector('#loading-state');
    const errorState = document.querySelector('#error-state');
    const projectCount = document.querySelector('#project-count');

    function normalizeClassValue(value) {
      return value.toLowerCase().trim().replace(/\s+/g, '-');
    }

    function createProjectCard(project) {
      const card = document.createElement('li');
      card.className = 'project-card';
      card.innerHTML = `
        <article aria-labelledby="${project.name}-title">
          <div class="project-card__header">
            <h3 id="${project.name}-title"></h3>
            <span class="project-card__priority"></span>
          </div>
          <dl class="project-card__details">
            <div><dt>Owner</dt><dd class="project-card__owner"></dd></div>
            <div><dt>Status</dt><dd class="project-card__status"></dd></div>
            <div><dt>Recent activity</dt><dd class="project-card__activity"></dd></div>
          </dl>
        </article>`;

      card.querySelector('h3').textContent = project.name;
      const priority = card.querySelector('.project-card__priority');
      priority.className = `project-card__priority priority priority--${normalizeClassValue(project.priority)}`;
      priority.textContent = project.priority;
      card.querySelector('.project-card__owner').textContent = project.owner;
      const status = card.querySelector('.project-card__status');
      status.className = `project-card__status status status--${normalizeClassValue(project.status)}`;
      status.textContent = project.status;
      card.querySelector('.project-card__activity').textContent = project.recentActivity;
      return card;
    }

    async function loadProjects() {
      try {
        const response = await fetch('project-data.json');
        if (!response.ok) {
          throw new Error(`Project data request failed: ${response.status}`);
        }

        const data = await response.json();
        if (!data || !Array.isArray(data.projects)) {
          throw new Error('Project data must contain a projects array.');
        }

        const cards = data.projects.map(createProjectCard);
        projectList.replaceChildren(...cards);
        projectCount.textContent = `${data.projects.length} active projects`;
        loadingState.hidden = true;
        errorState.hidden = true;
        projectList.setAttribute('aria-busy', 'false');
      } catch (error) {
        loadingState.hidden = true;
        errorState.hidden = false;
        projectList.setAttribute('aria-busy', 'false');
        console.error(error);
      }
    }

    loadProjects();
  </script>
</body>
</html>
